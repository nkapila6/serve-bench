[project]
name = "serve-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikhil Kapila", email = "12816113+nkapila6@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
serve-bench = "serve_bench.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name="pytorch-cpu"
url="https://download.pytorch.org/whl/cpu"
explicit=true

[tool.uv.sources]
torch = {index="pytorch-cpu"}
